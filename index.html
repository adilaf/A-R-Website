<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0604" />
  <title>Adil & Rohma — Wedding Reception</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --crimson: #8B1A1A;
      --gold: #C8922A;
      --cream: #F5F0E8;
      --dark: #2A1810;
      --light-gold: #E8C97A;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #0e0604;
      font-family: 'Cormorant Garamond', serif;
      color: var(--dark);
      overflow-x: hidden;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    body.load-screen-active {
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    /* ── PARTICLE BACKGROUND ── */
    #particles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    /* ── PRELOADER ── */
    .preload-indicator {
      position: fixed; inset: 0; z-index: 100;
      background: #0e0604;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }
    .preload-indicator.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .preload-indicator .loading-video {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center center;
      display: block;
    }

    /* ── MAIN CARD SCENE ── */
    .card-area {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%;
      min-height: 100svh;
      padding: 32px 16px 100px;
    }

    .card-scene {
      position: relative;
      perspective: 1200px;
      width: min(390px, 86vw);
      aspect-ratio: 3/4;
      max-height: calc(100svh - 200px);
    }

    @media (max-height: 680px) {
      .card-scene {
        width: auto;
        height: calc(100svh - 200px);
      }
      .card-area { padding-bottom: 80px; }
    }

    .card-flipper {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.4s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }
    .card-flipper.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.85),
        0 0 0 1px rgba(200,146,42,0.18);
    }
    .card-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-back { transform: rotateY(180deg); }

    .card-front::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.1) 50%, transparent 62%);
      background-size: 200% 100%;
      animation: shimmer 3.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    .card-glow {
      position: absolute; inset: -14px;
      border-radius: 12px;
      background: radial-gradient(ellipse at 50% 50%, rgba(200,146,42,0.18) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes pulse-glow {
      from { opacity: 0.4; transform: scale(0.98); }
      to   { opacity: 0.9; transform: scale(1.02); }
    }

    /* ── ACTION BUTTONS (beneath card, revealed after flip) ── */
    .action-bar {
      display: flex;
      flex-direction: row;
      gap: 12px;
      margin-top: 28px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }
    .action-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      padding: 0 24px;
      height: 50px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--crimson);
      color: var(--light-gold);
      border: none;
      box-shadow: 0 4px 20px rgba(139,26,26,0.5);
    }
    .btn-primary:active { background: #a02020; transform: scale(0.97); }

    .btn-outline {
      background: rgba(200,146,42,0.06);
      color: var(--light-gold);
      border: 1px solid rgba(200,146,42,0.4);
    }
    .btn-outline:active { background: rgba(200,146,42,0.15); transform: scale(0.97); }

    /* ── RSVP BOTTOM SHEET MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none;
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }
    .modal-backdrop.open {
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 640px;
      background: #180d08;
      border-top: 1px solid rgba(200,146,42,0.28);
      border-radius: 18px 18px 0 0;
      padding: 0 0 env(safe-area-inset-bottom);
      transform: translateY(100%);
      transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 92svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-handle-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 20px 10px;
      gap: 10px;
      border-bottom: 1px solid rgba(200,146,42,0.1);
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: rgba(200,146,42,0.3);
      border-radius: 2px;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.24em;
      color: rgba(232,201,122,0.55);
    }
    .modal-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none; border: none;
      color: rgba(200,146,42,0.45);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      touch-action: manipulation;
      transition: color 0.2s;
    }
    .modal-close:active { color: var(--light-gold); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 0;
    }

    /* forms.app embed wrapper */
    #formsapp-embed {
      min-height: 560px;
      width: 100%;
    }

    /* Footer */
    footer {
      position: relative; z-index: 10;
      text-align: center;
      padding: 26px 16px;
      padding-bottom: calc(26px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(200,146,42,0.1);
      font-family: 'Cinzel', serif;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      color: rgba(200,146,42,0.26);
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .card-flipper { transition: none; }
    }
  </style>
</head>
<body class="load-screen-active">

  <!-- PRELOADER -->
  <div class="preload-indicator" id="preloader">
    <video class="loading-video" id="loading-video" autoplay muted playsinline>
      <source src="260123_A+R_logo.mp4" type="video/mp4" />
    </video>
  </div>

  <canvas id="particles"></canvas>

  <!-- CARD + BUTTONS -->
  <div class="card-area">
    <div class="card-scene" id="flip-scene">
      <div class="card-glow"></div>
      <div class="card-flipper" id="flipper">
        <div class="card-face card-front">
          <img src="Img/cover.png" alt="Wedding invitation cover" loading="eager" />
        </div>
        <div class="card-face card-back">
          <img src="Img/reception.png" alt="Wedding reception invitation" loading="eager" />
        </div>
      </div>
    </div>

    <!-- Revealed after card flips -->
    <div class="action-bar" id="action-bar">
      <button class="btn btn-primary" onclick="openRsvp()">✦ RSVP</button>
      <a href="Img/reception.png" download="Adil_Rohma_Wedding_Reception.png" class="btn btn-outline">↓ Download Invite</a>
    </div>
  </div>

  <!-- RSVP BOTTOM SHEET -->
  <div class="modal-backdrop" id="rsvp-modal" aria-modal="true" role="dialog" aria-label="RSVP Form">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle-bar">
        <div class="modal-handle"></div>
        <span class="modal-title">RSVP · 15 AUGUST 2026 · WESTMINSTER, WA</span>
      </div>
      <button class="modal-close" onclick="closeRsvp()" aria-label="Close">✕</button>
      <div class="modal-body">
        <div data-tf-live="01KV0J6EDP7ACB5NNDTX282B54"></div><script src="//embed.typeform.com/next/embed.js"></script>
      </div>
    </div>
  </div>

  <footer>
    <p>ADIL &amp; ROHMA · 15 AUGUST 2026 · WESTMINSTER, WA</p>
  </footer>

  <script>
    // ── PARTICLES ──
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const isMobile = window.innerWidth < 768;
    let particles = [];
    let bgGrad = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      bgGrad = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.4, 0,
        canvas.width * 0.5, canvas.height * 0.5,
        Math.max(canvas.width, canvas.height) * 0.9
      );
      bgGrad.addColorStop(0, '#2a1208');
      bgGrad.addColorStop(1, '#0e0604');
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas, { passive: true });

    const MAX_PARTICLES = isMobile ? 25 : 55;
    const SPAWN_RATE    = isMobile ? 0.06 : 0.14;

    function spawnParticle() {
      particles.push({
        x: Math.random() * canvas.width,
        y: canvas.height + 6,
        size:  Math.random() * 1.4 + 0.4,
        speed: Math.random() * 0.45 + 0.18,
        opacity: 0,
        maxOp: Math.random() * 0.38 + 0.08,
        drift: (Math.random() - 0.5) * 0.22,
      });
    }

    function drawParticles() {
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.y > -8);
      for (const p of particles) {
        p.y -= p.speed;
        p.x += p.drift;
        p.opacity = Math.min(p.opacity + 0.007, p.maxOp);
        if (p.y < canvas.height * 0.22) p.opacity -= 0.005;
        const op = Math.max(0, p.opacity);
        if (op < 0.005) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,146,42,${op})`;
        ctx.fill();
      }
      if (Math.random() < SPAWN_RATE && particles.length < MAX_PARTICLES) spawnParticle();
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ── PRELOADER + AUTO-FLIP ──
    const preloader = document.getElementById('preloader');
    const loadingVideo = document.getElementById('loading-video');
    const flipper = document.getElementById('flipper');
    const actionBar = document.getElementById('action-bar');
    let pageLoaded = false;
    let videoEnded = false;

    function hidePreloader() {
      setTimeout(() => {
        preloader.classList.add('gone');
        document.body.classList.remove('load-screen-active');
      }, 500);
      // Flip card
      setTimeout(() => {
        flipper.classList.add('flipped');
      }, 2000);
      // Reveal buttons after flip completes
      setTimeout(() => {
        actionBar.classList.add('visible');
      }, 3600);
    }

    window.addEventListener('load', () => {
      pageLoaded = true;
      if (videoEnded) hidePreloader();
    });

    function onVideoDone() {
      videoEnded = true;
      if (pageLoaded) hidePreloader();
    }

    loadingVideo.addEventListener('ended', () => onVideoDone());

    if (isMobile) {
      loadingVideo.addEventListener('timeupdate', function stopAt3() {
        if (loadingVideo.currentTime >= 3) {
          loadingVideo.pause();
          loadingVideo.removeEventListener('timeupdate', stopAt3);
          onVideoDone();
        }
      });
    }

    setTimeout(() => {
      if (!preloader.classList.contains('gone')) {
        videoEnded = true;
        if (pageLoaded) hidePreloader();
      }
    }, 12000);

    // ── RSVP MODAL ──
    const modal = document.getElementById('rsvp-modal');
    const sheet = document.getElementById('modal-sheet');

    function openRsvp() {
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeRsvp() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // Close on backdrop tap (outside sheet)
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeRsvp();
    });

    // Swipe down to close
    let touchStartY = 0;
    sheet.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    sheet.addEventListener('touchend', (e) => {
      const delta = e.changedTouches[0].clientY - touchStartY;
      if (delta > 60) closeRsvp();
    }, { passive: true });

    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeRsvp();
    });
  </script>
</body>
</html>
